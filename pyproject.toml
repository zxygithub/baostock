[project]
name = "baostock-project"
version = "0.1.0"
description = "BaoStock data downloader - download Chinese A-share market data to SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "baostock>=0.9.1",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# smoke_test.py / integration_test.py 是需要联网、写数据库的手工脚本，
# 不应被 pytest 默认收集（它们匹配 *_test.py 通配符）。
python_files = ["test_*.py"]
