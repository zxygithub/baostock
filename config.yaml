# ============================================================================
# BaoStock Configuration File
# ============================================================================
# This file contains user-configurable settings for the BaoStock data download.
# Technical constants (field definitions, paths, index codes) are in src/config.py.
# ============================================================================

# ---------------------------------------------------------------------------
# API configuration
# ---------------------------------------------------------------------------
api:
  socket_timeout: 30  # seconds for socket recv/connect
  daily_request_limit: 46000  # daily API request limit
  min_request_interval: 0.30  # seconds floor between API requests (throttle); <=0 disables
  blacklist_backoff_minutes: 120  # data/.blacklisted 退避窗口(分钟);monitor 亦从 config_loader 读此值

# ---------------------------------------------------------------------------
# Download configuration
# ---------------------------------------------------------------------------
download:
  productive_pass_interval_minutes: 10  # 有新增数据趟次后的下一趟间隔分钟数
  idle_pass_interval_minutes: 90  # 空闲趟次退避封顶分钟数(连续空趟指数退避:10/20/40/80…封顶 90)
  # K-line data (daily/weekly/monthly/minute)
  kline:
    daily:
      enabled: true
      start_date: "1990-12-19"  # BaoStock market inception date
      adjustflags: [1, 2, 3]  # 1: post-adjust, 2: pre-adjust, 3: no adjust
    weekly:
      enabled: true
      adjustflags: [1, 2, 3]
    monthly:
      enabled: true
      adjustflags: [1, 2, 3]
    minute:
      enabled: false  # disabled by default (large data volume)
      start_date: "2019-01-02"  # BaoStock only has ~5 years of minute data
      frequencies: ["5", "15", "30", "60"]
      adjustflags: [3]  # only no-adjust for minute data

  # Financial data (quarterly reports)
  financial:
    enabled: true
    start_year: 2007
    types:
      - profit
      - operation
      - growth
      - balance
      - cashflow
      - dupont

  # Company reports (forecast/summary)
  reports:
    enabled: true
    start_date: "2003-01-01"

  # Dividend and adjust factor data
  dividend:
    enabled: true
    start_year: 2007

  # Macroeconomic data
  macro:
    enabled: true

  # Index constituents
  components:
    enabled: true

  # Index K-line data
  index_kline:
    enabled: true
    start_date: "2006-01-01"

# ---------------------------------------------------------------------------
# Stock filtering and batch processing
# ---------------------------------------------------------------------------
stocks:
  filter: "type=1 AND status=1"  # SQL filter for stock selection
  batch_size: 200  # stocks per batch; also the pacing window (pause once per N API requests)
  batch_sleep: 1  # seconds to pause after each pacing window (K-line/dividend/adjust/report)

# ---------------------------------------------------------------------------
# Email reporting (for daily_report.py / backup_to_baidu.py)
# ---------------------------------------------------------------------------
# Sensitive credentials (smtp_server, smtp_port, sender, password, receiver)
# should be set in .env file. Only the enabled switches stay here.
email:
  enabled: true        # daily_report.py 日报开关
  backup_notify: true  # backup_to_baidu.py 备份结果通知开关
